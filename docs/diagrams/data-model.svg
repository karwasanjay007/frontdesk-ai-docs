<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="604px" preserveAspectRatio="none" style="width:1311px;height:604px;background:#FFFFFF;" version="1.1" viewBox="0 0 1311 604" width="1311px" zoomAndPan="magnify"><title>FrontDesk AI 2.0.1: data model (types.ts, migrations/001_init.sql, kv.ts)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="469.9092" x="413.6797" y="24.5332">FrontDesk AI 2.0.1: data model (types.ts, migrations/001_init.sql, kv.ts)</text><!--class Clinic--><g id="elem_Clinic"><rect codeLine="17" fill="#E6F1F2" height="184.4844" id="Clinic" rx="5" ry="5" style="stroke:#0B5D63;stroke-width:0.5;" width="337.3018" x="131" y="194.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6201" x="221.8408" y="214.1426">clinic_data (the clinic file)</text><line style="stroke:#0B5D63;stroke-width:0.5;" x1="132" x2="467.3018" y1="222.2188" y2="222.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.958" x="137" y="240.752">id : integer, one row</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.1514" x="137" y="258.3613">json : ClinicData</text><line style="stroke:#0B5D63;stroke-width:1.0;" x1="132" x2="467.3018" y1="265.4375" y2="265.4375"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="325.3018" x="137" y="283.9707">clinic : name, address, phone, emergency_phone, ...</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.7129" x="137" y="301.5801">hours : day or range -&gt; timing text</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.8545" x="137" y="319.1895">doctors[] : name, role, days</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="288.6953" x="137" y="336.7988">services[] : name, price, note, duration, aliases</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.5615" x="137" y="354.4082">policies : name -&gt; text</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235.0127" x="137" y="372.0176">emergency_rules, bot_rules (optional)</text></g><!--class Message--><g id="elem_Message"><rect codeLine="29" fill="#E6F1F2" height="141.2656" id="Message" rx="5" ry="5" style="stroke:#0B5D63;stroke-width:0.5;" width="372.541" x="538" y="456.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.8066" x="692.3672" y="476.1426">messages</text><line style="stroke:#0B5D63;stroke-width:0.5;" x1="539" x2="909.541" y1="484.2188" y2="484.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="45.1309" x="544" y="502.752">id : text</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.3789" x="544" y="520.3613">chat_id : text</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.7832" x="544" y="537.9707">role : user | assistant | staff</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.7998" x="544" y="555.5801">text : text</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="360.541" x="544" y="573.1895">source : clinic-file | clinic-file-unsure | ai | guard | staff | null</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2754" x="544" y="590.7988">created_at : time</text></g><!--class Ticket--><g id="elem_Ticket"><rect codeLine="38" fill="#E6F1F2" height="141.2656" id="Ticket" rx="5" ry="5" style="stroke:#0B5D63;stroke-width:0.5;" width="448.6113" x="803" y="216.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6758" x="1007.4678" y="235.6426">tickets</text><line style="stroke:#0B5D63;stroke-width:0.5;" x1="804" x2="1250.6113" y1="243.7188" y2="243.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="45.1309" x="809" y="262.252">id : text</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.9775" x="809" y="279.8613">status : urgent | needs human | answered | closed</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.8799" x="809" y="297.4707">priority : P1 | P2 | P3</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="436.6113" x="809" y="315.0801">text : the question, with the requested day, date and time for a booking</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.9648" x="809" y="332.6895">reply : the staff reply, or null</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2754" x="809" y="350.2988">created_at : time</text></g><!--class Chat--><g id="elem_Chat"><rect codeLine="48" fill="#E6F1F2" height="70.8281" id="Chat" rx="5" ry="5" style="stroke:#0B5D63;stroke-width:0.5;" width="251.2441" x="628" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.8477" x="672.6982" y="65.1426">Chat (not stored as a row)</text><line style="stroke:#0B5D63;stroke-width:0.5;" x1="629" x2="878.2441" y1="73.2188" y2="73.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239.2441" x="634" y="91.752">chat id : made in the patient's browser,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.4063" x="634" y="109.3613">kept in its local storage</text></g><g id="elem_GMN10"><path d="M946.5,502.6094 L946.5,551.6641 A5,5 0 0 0 951.5,556.6641 L1299.2686,556.6641 A5,5 0 0 0 1304.2686,551.6641 L1304.2686,507.6094 L1294.2686,497.6094 L951.5,497.6094 A5,5 0 0 0 946.5,502.6094 " fill="#FFF6E8" style="stroke:#C97A1D;stroke-width:0.5;"/><path d="M1294.2686,497.6094 L1294.2686,505.1094 A2.5,2.5 0 0 0 1296.7686,507.6094 L1304.2686,507.6094 L1294.2686,497.6094 " fill="#FFF6E8" style="stroke:#C97A1D;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.7686" x="952.5" y="516.1045">P1 urgent: emergency. P2 needs human: booking request.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.3506" x="952.5" y="532.4561">P3 needs human: not in the clinic file.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.7852" x="952.5" y="548.8076">A staff reply sets answered; Close sets closed.</text></g><g id="elem_GMN13"><path d="M6,486.1094 L6,567.8672 A5,5 0 0 0 11,572.8672 L498.1377,572.8672 A5,5 0 0 0 503.1377,567.8672 L503.1377,491.1094 L493.1377,481.1094 L267.01,481.1094 L282.29,378.7994 L259.01,481.1094 L11,481.1094 A5,5 0 0 0 6,486.1094 " fill="#FFF6E8" style="stroke:#C97A1D;stroke-width:0.5;"/><path d="M493.1377,481.1094 L493.1377,488.6094 A2.5,2.5 0 0 0 495.6377,491.1094 L503.1377,491.1094 L493.1377,481.1094 " fill="#FFF6E8" style="stroke:#C97A1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.3423" x="12" y="499.6045">The same three shapes in each store, first one set up wins:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.834" x="12" y="515.9561">1 Postgres tables, when its address is set (not connected on the live site)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.1377" x="12" y="532.3076">2 Redis keys under one prefix: clinic, tickets (hash), msgs per chat (list). Live today</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.519" x="12" y="548.6592">3 server memory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="12" y="565.0107">With an empty store the clinic file that ships with the app is used.</text></g><!--link Chat to Message--><g id="link_Chat_Message"><path codeLine="53" d="M749.69,117.0394 C747.37,139.2394 744.48,168.5794 742.5,194.6094 C735.63,284.9794 730.41,389.4094 727.4,456.5294 " fill="none" id="Chat-Message" style="stroke:#0B5D63;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.9199" x="743.5" y="292.1045">chat_id</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="741.4781" y="137.8537">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="707.7695" y="445.9254">0..*</text></g><!--link Chat to Ticket--><g id="link_Chat_Ticket"><path codeLine="54" d="M799.98,116.6294 C836.55,143.7894 888.69,182.5094 933.83,216.0394 " fill="none" id="Chat-Ticket" style="stroke:#0B5D63;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.9199" x="858.5" y="161.1045">chat_id</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="800.6346" y="137.9231">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="904.2371" y="205.4364">0..*</text></g><!--link Ticket to Message--><g id="link_Ticket_Message"><path codeLine="55" d="M883.2,357.1294 C858.02,372.3494 833.03,389.6494 811.5,408.6094 C795.79,422.4494 781.16,439.5694 768.56,456.4194 " fill="none" id="Ticket-Message" style="stroke:#0B5D63;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.8569" x="812.5" y="423.1045">a staff reply adds one message with role staff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="860.99" y="378.7263">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6836" x="751.0798" y="445.804">0..1</text></g><!--link Clinic to Message--><g id="link_Clinic_Message"><path codeLine="56" d="M372.31,378.8794 C389.61,396.5094 409.04,413.5294 429.5,426.6094 C465.38,449.5394 480.12,443.0794 520.5,456.6094 C526.18,458.5094 526.2538,458.5344 532.0738,460.4944 " fill="none" id="Clinic-to-Message" style="stroke:#0B5D63;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#0B5D63" points="537.76,462.4094,530.5073,455.7462,533.0215,460.8136,527.9541,463.3278,537.76,462.4094" style="stroke:#0B5D63;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.3379" x="430.5" y="423.1045">every answer is worked out from the file in use</text></g><!--link Ticket to GMN10--><g id="link_Ticket_GMN10"><path d="M1059.5,357.3594 C1066.92,374.0594 1074.65,391.8994 1081.5,408.6094 C1093.81,438.6394 1106.7,473.5194 1115.32,497.4294 " fill="none" id="Ticket-GMN10" style="stroke:#0B5D63;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[ZLNVQ-D647xNNp7u7ceNHxKJchOk7EIICnIk4Cf17qe96saiRRtQrUsiuZFN_k_zTbUEbRk3zaMsvlTyyyr8zjhsogkE7bMrRxmRR7thZFDqQ7NWGfxrqghQ7RHjQAUCJ3MZaxViQRsQA2gZHEXJGVJ6-Pfz3lngzURxk-khAFqivQktrzlrzXAQ6-_TuQNvFvF0rWN-CkxjJp_ShE- -5dUxtLw__H4XMbqpLTfNXlF_ZaFhQYc23ePfwvqDTonxklc5BijLkTvGhOAYpjLiQ1wEFKiPP4cTRhmAsbdvRhLQFsYhGoaVp9BsJz0lYYBtFgiCLDL32Z8FBP8d0Usqu