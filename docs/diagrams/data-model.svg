<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="718px" preserveAspectRatio="none" style="width:581px;height:718px;background:#FFFFFF;" version="1.1" viewBox="0 0 581 718" width="581px" zoomAndPan="magnify"><title>FrontDesk AI data model: the server's tables</title><defs/><g><text fill="#0B5D63" font-family="Segoe UI" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="373.333" x="96.729" y="29.4238">FrontDesk AI data model: the server's tables</text><!--cluster Server: Postgres on Neon, through api/_store.js--><g id="cluster_Server: Postgres on Neon, through api/_store.js"><path d="M13,50.9414 L293.8628,50.9414 A10.5,10.5 0 0 1 300.8628,57.9414 L307.8628,74.2324 L303,74.2324 A7,7 0 0 1 310,81.2324 L310,703.9414 A7,7 0 0 1 303,710.9414 L13,710.9414 A7,7 0 0 1 6,703.9414 L6,57.9414 A7,7 0 0 1 13,50.9414 " fill="#FFFFFF" style="stroke:#9BBFC2;stroke-width:1.5;"/><line style="stroke:#9BBFC2;stroke-width:1.5;" x1="6" x2="307.8628" y1="74.2324" y2="74.2324"/><text fill="#0B5D63" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="288.8628" x="10" y="66.9697">Server: Postgres on Neon, through api/_store.js</text></g><!--class tickets--><g id="elem_tickets"><rect codeLine="39" fill="#FFFFFF" height="208.2012" id="tickets" rx="7" ry="7" style="stroke:#0B5D63;stroke-width:1.6;" width="237.3545" x="56.5" y="86.9414"/><rect fill="#E3F0F1" height="27.291" rx="7" ry="7" style="stroke:#E3F0F1;stroke-width:1.6;" width="237.3545" x="56.5" y="86.9414"/><rect fill="#E3F0F1" height="7" style="stroke:#E3F0F1;stroke-width:1.6;" width="237.3545" x="56.5" y="107.2324"/><rect codeLine="39" fill="none" height="208.2012" id="tickets" rx="7" ry="7" style="stroke:#0B5D63;stroke-width:1.6;" width="237.3545" x="56.5" y="86.9414"/><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="36.7402" x="156.8071" y="105.9697">tickets</text><line style="stroke:#0B5D63;stroke-width:1.6;" x1="57.5" x2="292.8545" y1="114.2324" y2="114.2324"/><text fill="#2F4245" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.7432" x="62.5" y="132.2607">id</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="107.6689" x="77.8042" y="132.2607">: TEXT, primary key</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="78.1777" x="62.5" y="149.5518">patient : TEXT</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="225.3545" x="62.5" y="166.8428">owner : TEXT  (hash of the browser key)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="71.6206" x="62.5" y="184.1338">status : TEXT</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="182.8442" x="62.5" y="201.4248">priority : TEXT  (urgent | normal)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="146.3262" x="62.5" y="218.7158">text : TEXT  (the question)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="66.2061" x="62.5" y="236.0068">reply : TEXT</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="62.5" y="253.2979">data : JSONB  (the whole ticket)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="108.9766" x="62.5" y="270.5889">created_at : BIGINT</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="114.3086" x="62.5" y="287.8799">updated_at : BIGINT</text></g><!--class messages--><g id="elem_messages"><rect codeLine="51" fill="#FFFFFF" height="156.3281" id="messages" rx="7" ry="7" style="stroke:#0B5D63;stroke-width:1.6;" width="237.3545" x="56.5" y="390.9414"/><rect fill="#E3F0F1" height="27.291" rx="7" ry="7" style="stroke:#E3F0F1;stroke-width:1.6;" width="237.3545" x="56.5" y="390.9414"/><rect fill="#E3F0F1" height="7" style="stroke:#E3F0F1;stroke-width:1.6;" width="237.3545" x="56.5" y="411.2324"/><rect codeLine="51" fill="none" height="156.3281" id="messages" rx="7" ry="7" style="stroke:#0B5D63;stroke-width:1.6;" width="237.3545" x="56.5" y="390.9414"/><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="55.6118" x="147.3713" y="409.9697">messages</text><line style="stroke:#0B5D63;stroke-width:1.6;" x1="57.5" x2="292.8545" y1="418.2324" y2="418.2324"/><text fill="#2F4245" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.7432" x="62.5" y="436.2607">id</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="138.855" x="77.8042" y="436.2607">: BIGSERIAL, primary key</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="78.3872" x="62.5" y="453.5518">chat_id : TEXT</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="180.0322" x="62.5" y="470.8428">role : TEXT  (patient | bot | staff)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="213.9922" x="62.5" y="488.1338">text : TEXT  (at most 6,000 characters)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="75.6196" x="62.5" y="505.4248">source : TEXT</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="225.3545" x="62.5" y="522.7158">owner : TEXT  (hash of the browser key)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="108.9766" x="62.5" y="540.0068">created_at : BIGINT</text></g><!--class clinic_data--><g id="elem_clinic_data"><rect codeLine="60" fill="#FFFFFF" height="87.1641" id="clinic_data" rx="7" ry="7" style="stroke:#0B5D63;stroke-width:1.6;" width="224.6465" x="65.5" y="607.9414"/><rect fill="#E3F0F1" height="27.291" rx="7" ry="7" style="stroke:#E3F0F1;stroke-width:1.6;" width="224.6465" x="65.5" y="607.9414"/><rect fill="#E3F0F1" height="7" style="stroke:#E3F0F1;stroke-width:1.6;" width="224.6465" x="65.5" y="628.2324"/><rect codeLine="60" fill="none" height="87.1641" id="clinic_data" rx="7" ry="7" style="stroke:#0B5D63;stroke-width:1.6;" width="224.6465" x="65.5" y="607.9414"/><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="59.4966" x="148.075" y="626.9697">clinic_data</text><line style="stroke:#0B5D63;stroke-width:1.6;" x1="66.5" x2="289.1465" y1="635.2324" y2="635.2324"/><text fill="#2F4245" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.7432" x="71.5" y="653.2607">id</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="197.3423" x="86.8042" y="653.2607">: INTEGER  (always 1, the only row)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="200.4019" x="71.5" y="670.5518">data : JSONB  (the edited clinic file)</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="114.3086" x="71.5" y="687.8428">updated_at : BIGINT</text></g><g id="elem_GMN8"><path d="M329,144.9414 L329,186.9414 L293.59,190.9414 L329,194.9414 L329,236.707 A7,7 0 0 0 336,243.707 L541.8555,243.707 A7,7 0 0 0 548.8555,236.707 L548.8555,147.9414 L538.8555,137.9414 L336,137.9414 A7,7 0 0 0 329,144.9414 " fill="#F4F8F8" style="stroke:#9BBFC2;stroke-width:0.5;"/><path d="M538.8555,137.9414 L538.8555,144.4414 A3.5,3.5 0 0 0 542.3555,147.9414 L548.8555,147.9414 L538.8555,137.9414 " fill="#F4F8F8" style="stroke:#9BBFC2;stroke-width:0.5;"/><text fill="#2F4245" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="60.5449" x="335" y="155.8906">Written by</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="130.7695" x="398.832" y="155.8906">sync.js, POST /api/tickets</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="189.252" x="335" y="171.8516">A merge keeps every staff reply; the</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="175.8809" x="335" y="187.8125">status further along wins. Patient,</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="168.2051" x="335" y="203.7734">question, bot reply, created and</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="175.8691" x="335" y="219.7344">owner never change once stored.</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="198.8555" x="335" y="235.6953">Deleted seven days after it was made.</text></g><g id="elem_GMN11"><path d="M328.5,438.9414 L328.5,464.9414 L293.59,468.9414 L328.5,472.9414 L328.5,498.7852 A7,7 0 0 0 335.5,505.7852 L566.791,505.7852 A7,7 0 0 0 573.791,498.7852 L573.791,441.9414 L563.791,431.9414 L335.5,431.9414 A7,7 0 0 0 328.5,438.9414 " fill="#F4F8F8" style="stroke:#9BBFC2;stroke-width:0.5;"/><path d="M563.791,431.9414 L563.791,438.4414 A3.5,3.5 0 0 0 567.291,441.9414 L573.791,441.9414 L563.791,431.9414 " fill="#F4F8F8" style="stroke:#9BBFC2;stroke-width:0.5;"/><text fill="#2F4245" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="60.5449" x="334.5" y="449.8906">Written by</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="160.459" x="398.332" y="449.8906">shared.js, POST /api/messages</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="165.873" x="334.5" y="465.8516">The question, the bot reply and</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="160.0313" x="334.5" y="481.8125">each staff reply, one row each.</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="198.8555" x="334.5" y="497.7734">Deleted seven days after it was made.</text></g><g id="elem_GMN14"><path d="M326.5,621.4414 L326.5,647.4414 L290.58,651.4414 L326.5,655.4414 L326.5,681.2852 A7,7 0 0 0 333.5,688.2852 L546.3105,688.2852 A7,7 0 0 0 553.3105,681.2852 L553.3105,624.4414 L543.3105,614.4414 L333.5,614.4414 A7,7 0 0 0 326.5,621.4414 " fill="#F4F8F8" style="stroke:#9BBFC2;stroke-width:0.5;"/><path d="M543.3105,614.4414 L543.3105,620.9414 A3.5,3.5 0 0 0 546.8105,624.4414 L553.3105,624.4414 L543.3105,614.4414 " fill="#F4F8F8" style="stroke:#9BBFC2;stroke-width:0.5;"/><text fill="#2F4245" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="60.5449" x="332.5" y="632.3906">Written by</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="135.7207" x="396.332" y="632.3906">shared.js, POST /api/clinic</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="205.8105" x="332.5" y="648.3516">(desk code). No link to the other tables</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="194.0625" x="332.5" y="664.3125">and no expiry. When there is no row,</text><text fill="#2F4245" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="187.5059" x="332.5" y="680.2734">the shipped clinic-data.json is used.</text></g><!--link tickets to messages--><g id="link_tickets_messages"><path codeLine="67" d="M175,295.1014 C175,326.8014 175,361.1214 175,390.7614 " fill="none" id="tickets-messages" style="stroke:#0B5D63;stroke-width:1.4;"/><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="194.9556" x="176" y="339.9697">tickets.patient = messages.chat_id</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="182.5776" x="182.189" y="357.2607">(the patient id); the same owner</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="18.0654" x="156.357" y="317.0543">0..*</text><text fill="#2F4245" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="18.0654" x="156.157" y="379.7972">0..*</text></g><!--link messages to clinic_data--><!--SRC=[hLPTZzf657tthxYY3mqLwmLsizhID19a8QMgo2fGfL9RhGRF1KynCyxCkCHD-E-zCxR1ti0cKii30j_lSywTiHKsGPXe9UqTcWqCfy2PPR1L79C1s1Z1eFuRzRS6B5icQ8B0R8HCcMPRMB9eizOga_oLIfI6RoR-K_CmCUDg9-GQLYmnMBEKOLgYXjvrpS1nnRB4JgYb6TiYjEQuLWY_JbkddURY7uJULSretL17q-qfKzbmT_JyxgOUEzHQxPuqrgBxa-l-zVF73ejOH1k9na0lh0yM9OoUVGm0HcTm8ulI77MpVlMqdlU6dlw4Z9v-bcjyDUbEUcIlDTgxwb_rNSpGMYsMcSNFfm2OMzIeR9wUG6XV6qGgYsVck9xSJcuVp_7zQ3HvrMzsT2XwvAdVA99IRhOkwtmfsn6fCyZkWrXmX4ZeAC7YznPjhBW935hIk2jgAK0gYO5LALW5IsMj8gq9ZP4LIWP1rHHfqYt50EwLiMkD1fI46IhPePMXykiOM2ek7mobnF0lq_9Ze2JvvQJ1Q8EsK0B0nvN0XE_XnVAbu2ykbozX08lnRuiEf5ficSvXWtd3CsLMKAhIhs5IExTEXG7WMSnC36hbrtX9ogHLTjdQZHXZcStCgMpKWDAkuqF2JAzTvKy4azwof9d8uWTxT7KrtsTe771DFurfaf-gvq-U0VmyVpCRbHbsiQBpgK2icINIo2po1-PgZgQlfxDciYpb9-px8mrRsYJYyYaUA6m-VZiT_dAUZ2Xcza7mK-Der_e1ZugrJqvMz4smhrPF0KYDRqbTSDFfThkkZcOHBQXvn9xAT8J_bnPEWre3BKg45D63P-eyRXGsVZr-wuP8TYod0wlZwof9n5FjzfTeHoweZR8Qh4I2xQyYTny4rNQrkc7uNGikwFgH5zM_0-U3QWl3YfSV3yQmvFGFwNkf70Hl_r1SYEvMykW6XtmNlzEPmb7-MPIhmHG4_hZKOXrRZtzHbzebnDxHUbcKiCmzSYQN4PqM7RX_Cr_0fJj2Zkv3Qf3MZqZ3r03IyPCN8YeMolT6RkKwhp9D_pMmHD7bIpUm2U6-cAH3NjLcThmQVO9EnJumoScbq8zqXPpwvDhnHrBpPneFoUCE4tJ-XdmaqKX4inL958I57JEmfVif351oVsCy1gB2xZGI97SgqiIY5h6edIw5jWvpbEqZY-8wFXtg7ftulEM_jr-d-AidA8B8_nbtRriHlMMrGvWfeESRT-NuBV74bMzRuCQX1W0_f4Bd8RoBgORpG1366MWanwXNPYpIzB0t5wutQe2k9lBCZ2EjckPV]--></g></svg>